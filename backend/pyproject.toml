[project]
name = "civiclens-backend"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "starlette==1.10.0",  # pinned: fixes PYSEC-2026-161/248/249/1941/1942/2280/2281
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.34",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.1",
    "geoalchemy2==0.17.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "shapely==2.0.6",
    "boto3==1.35.99",
    "Pillow==13.0.0",
    "pandas==3.1.1",
    "anthropic==2.12.0",
]

[dependency-groups]
# Test and lint tools. Not installed in the Docker image.
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F"]
# E712: SQLAlchemy filters need `column == True`, so this rule only gives false positives here.
ignore = ["E501", "E712"]
